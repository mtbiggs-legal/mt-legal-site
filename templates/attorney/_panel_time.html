<!-- Time & Notes -->
<div id="tab-time" class="portal-panel">
  <div class="page-header" style="margin-bottom:1.25rem">
    <h1 style="font-size:1.5rem">Time &amp; Notes</h1>
  </div>

  <!-- Billing status -->
  <div class="card" id="bill-status-card" style="margin-bottom:1.25rem">
    <div class="portal-section-title">Billing Status</div>
    <div id="bill-status-summary"></div>
    <button type="button" class="btn btn-primary" id="bill-issue-btn">Issue statement now</button>
    <div id="bill-status-result"></div>
    <div id="bill-statements" style="overflow-x:auto"></div>
  </div>

  <!-- Unified entry card -->
  <div class="card" style="margin-bottom:1.25rem">
    <div class="portal-section-title">New Entry</div>
    <div class="form-grid">
      <div class="form-group">
        <label for="be-date">Date</label>
        <input type="date" id="be-date" />
      </div>
      <div class="form-group">
        <label for="be-hours">Billable Hours</label>
        <input type="number" id="be-hours" step="0.25" min="0" placeholder="e.g. 1.5" />
      </div>
      <div class="form-group full">
        <label for="be-category">Category</label>
        <select id="be-category">
          <option value="Meeting">Meeting</option>
          <option value="Court Appearance">Court Appearance</option>
          <option value="Research">Research</option>
          <option value="Drafting">Drafting</option>
          <option value="Filing">Filing</option>
          <option value="Phone/Email">Phone / Email</option>
          <option value="Negotiation">Negotiation</option>
          <option value="Witness/Investigation">Witness / Investigation</option>
          <option value="Travel">Travel</option>
          <option value="Overhead">Overhead</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="form-group full">
        <label for="be-note">Note / Description *</label>
        <textarea id="be-note" rows="4" placeholder="Describe work performed, case notes, observations, strategy…"></textarea>
      </div>
    </div>
    <div id="be-result" style="margin-top:.75rem"></div>
    <button class="btn btn-primary" onclick="logBillingEntry()" style="margin-top:.75rem">Log Entry →</button>
  </div>

  <!-- Billing log + running total -->
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
      <div class="portal-section-title" style="margin-bottom:0">Billing Log</div>
      <div id="be-total" style="font-family:Georgia,serif;font-size:1.1rem;font-weight:bold;color:var(--navy)">Total: 0 hrs</div>
    </div>
    <table class="time-log-table">
      <thead><tr><th>Date</th><th>Category</th><th>Hours</th><th>Note</th></tr></thead>
      <tbody id="billing-log-tbody"></tbody>
    </table>
  </div>
</div>
