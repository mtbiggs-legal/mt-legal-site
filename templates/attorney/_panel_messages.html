<!-- Messages -->
<div id="tab-messages" class="portal-panel">
  <div class="page-header" style="margin-bottom:1.25rem">
    <h1 style="font-size:1.5rem">Client Messages</h1>
  </div>
  <div class="card">
    <div class="portal-section-title">Thread</div>
    <div class="message-thread" id="atty-message-thread"></div>
    <div class="form-group" style="margin-bottom:.75rem;margin-top:.75rem">
      <label for="atty-reply-text">Reply</label>
      <textarea id="atty-reply-text" rows="3" placeholder="Your reply to the client…"></textarea>
    </div>
    <div id="atty-reply-result" style="margin-bottom:.5rem"></div>
    <button class="btn btn-primary" onclick="sendReply()">Send Reply →</button>
  </div>
</div>
