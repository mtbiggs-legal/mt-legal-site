<!-- ── Meeting Scheduler Modal ────────────────────────────────────────────── -->
<div id="meeting-modal" class="modal-overlay" style="display:none" onclick="closeMeetingModal(event)">
  <div class="modal-box consult-modal" style="max-width:460px">
    <div class="modal-header">
      <h2>Schedule Meeting</h2>
      <button class="modal-close" onclick="closeMeetingModal()">✕</button>
    </div>
    <div class="modal-body" style="padding:1.5rem">
      <div class="form-grid">
        <div class="form-group">
          <label for="mtg-date">Date</label>
          <input type="date" id="mtg-date" />
        </div>
        <div class="form-group">
          <label for="mtg-time">Time</label>
          <input type="time" id="mtg-time" />
        </div>
        <div class="form-group full">
          <label for="mtg-note">Meeting Type / Note</label>
          <input type="text" id="mtg-note" placeholder="e.g. Initial consultation, Deposition prep…" />
        </div>
      </div>
      <div id="mtg-result" style="margin-top:.5rem"></div>
      <div class="btn-group" style="margin-top:1.1rem">
        <button class="btn btn-primary" onclick="saveMeeting()">Set Meeting →</button>
        <button class="btn btn-secondary" onclick="closeMeetingModal()">Cancel</button>
      </div>
    </div>
  </div>
</div>

<!-- ── Add Calendar Event Modal ──────────────────────────────────────────── -->
<div id="dash-add-event-modal" class="modal-overlay" style="display:none" onclick="closeDashAddEventModal(event)">
  <div class="modal-box consult-modal" style="max-width:480px">
    <div class="modal-header">
      <h2>Add Calendar Event</h2>
      <button class="modal-close" onclick="closeDashAddEventModal()">&#x2715;</button>
    </div>
    <div class="modal-body" style="padding:1.5rem">
      <div class="form-grid">
        <div class="form-group full">
          <label for="dae-client">Client</label>
          <select id="dae-client">{% for c in clients %}<option value="{{ c.username }}">{{ c.client_name or c.username }}</option>{% endfor %}</select>
        </div>
        <div class="form-group">
          <label for="dae-type">Event Type</label>
          <select id="dae-type">
            <option value="Court Date">Court Date</option>
            <option value="Meeting">Meeting</option>
          </select>
        </div>
        <div class="form-group">
          <label for="dae-date">Date</label>
          <input type="date" id="dae-date" />
        </div>
        <div class="form-group">
          <label for="dae-time">Time</label>
          <input type="time" id="dae-time" />
        </div>
        <div class="form-group full">
          <label for="dae-note">Note / Description</label>
          <input type="text" id="dae-note" placeholder="e.g. Arraignment, Deposition prep…" />
        </div>
      </div>
      <div id="dae-result" style="margin-top:.5rem"></div>
      <div class="btn-group" style="margin-top:1.1rem">
        <button class="btn btn-primary" onclick="saveDashEvent()">Save Event &#x2192;</button>
        <button class="btn btn-secondary" onclick="closeDashAddEventModal()">Cancel</button>
      </div>
    </div>
  </div>
</div>

<!-- ── Log Time Modal ─────────────────────────────────────────────────────── -->
<div id="dash-log-time-modal" class="modal-overlay" style="display:none" onclick="closeDashLogTimeModal(event)">
  <div class="modal-box consult-modal" style="max-width:480px">
    <div class="modal-header">
      <h2>Log Billable Time</h2>
      <button class="modal-close" onclick="closeDashLogTimeModal()">&#x2715;</button>
    </div>
    <div class="modal-body" style="padding:1.5rem">
      <div class="form-grid">
        <div class="form-group full">
          <label for="dlt-client">Client</label>
          <select id="dlt-client">{% for c in clients %}<option value="{{ c.username }}">{{ c.client_name or c.username }}</option>{% endfor %}</select>
        </div>
        <div class="form-group">
          <label for="dlt-date">Date</label>
          <input type="date" id="dlt-date" />
        </div>
        <div class="form-group">
          <label for="dlt-hours">Billable Hours</label>
          <input type="number" id="dlt-hours" step="0.25" min="0" placeholder="e.g. 1.5" />
        </div>
        <div class="form-group full">
          <label for="dlt-note">Note / Description *</label>
          <textarea id="dlt-note" rows="3" placeholder="Describe work performed…"></textarea>
        </div>
      </div>
      <div id="dlt-result" style="margin-top:.5rem"></div>
      <div class="btn-group" style="margin-top:1.1rem">
        <button class="btn btn-primary" onclick="saveDashLogTime()">Log Entry &#x2192;</button>
        <button class="btn btn-secondary" onclick="closeDashLogTimeModal()">Cancel</button>
      </div>
    </div>
  </div>
</div>

<!-- ── Document Preview Modal ─────────────────────────────────────────────── -->
<div id="doc-preview-overlay" class="doc-preview-overlay" style="display:none"
     onclick="closeDocPreview(event)">
  <div class="doc-preview-box">
    <div class="doc-preview-header">
      <div class="doc-preview-title" id="doc-preview-title">Document</div>
      <a id="doc-preview-dl" href="#" class="doc-btn"
         style="color:#fff;border-color:rgba(255,255,255,.3);background:transparent">
        ↓ Download
      </a>
      <button onclick="closeDocPreview()" class="doc-btn"
              style="color:#fff;border-color:rgba(255,255,255,.3);background:transparent">
        ✕ Close
      </button>
    </div>
    <div class="doc-preview-body" id="doc-preview-body"></div>
  </div>
</div>
