[[practice_areas.family-law.faqs]]
q = "How long does a Tennessee divorce take?"
a = """\
    There is a 60-day waiting period without children and 90 days with children. \
    Uncontested divorces can finish shortly after; contested ones take longer."""

[[practice_areas.family-law.faqs]]
q = "Can crypto be hidden in a divorce?"
a = """\
    It is harder than people think. Exchange records, tax filings, and on-chain \
    analysis often reveal it."""


[practice_areas.rwa-tokenization]
name = "Real World Assets & Tokenization"
tagline = """\
    Turn real-world assets, from Nashville real estate to loans and revenue streams, \
    into compliant digital securities."""
case_types = ["Real World Assets Tokenization", "Real Estate"]
helps = [
    """\
        Structures the deal so investors buy compliant securities, not an accidental \
        unregistered offering.""",
    """\
        Clears title, liens, and lender consent before the property moves into the \
        owning entity.""",
    """\
        Drafts the offering documents and coordinates the auditor, transfer agent, \
        and trading platform.""",
    """\
        Handles ongoing filings, investor communications, and resale compliance \
        after launch.""",
]
overview = """\
    Tokenization puts ownership of a real-world asset (a building, a loan, a revenue \
    stream, or the entity that owns it) on a blockchain, so it can be issued, \
    transferred, and tracked as digital tokens. Done right, it opens an asset to \
    smaller investors and faster transfers. Done wrong, it is an unregistered \
    securities offering. We handle the legal structure end to end, with deep \
    experience in Nashville-area real estate."""
focus = [
    "Choosing the ownership vehicle",
    "Securities exemptions and state filings",
    "Offering documents and token terms",
    "Investor verification and onboarding",
    "Title and recording issues",
]

[practice_areas.rwa-tokenization.story]
heading = "Where passion meets paper"
paras = [
    """\
        Tokenization is the part of this space I find most exciting. It lets \
        everyday investors own a piece of assets that used to be reserved for \
        institutions, like a Nashville building or a stream of revenue. Since 2017 I \
        have seen plenty of projects promise that, and I have seen how many skipped \
        the legal work that makes it real.""",
    """\
        I build the structure so the token actually represents what it claims to: \
        the right entity, the right securities exemption, clean title, and transfer \
        rules that hold up. And because I am a trial attorney, I draft every \
        offering with an eye to how it would read if it were ever challenged.""",
]

[[practice_areas.rwa-tokenization.process]]
title = "Asset and title diligence"
detail = """\
    Title search, existing liens and lender consent, zoning, short-term rental \
    permits, and valuation."""

[[practice_areas.rwa-tokenization.process]]
title = "Structure selection"
detail = """\
    Entity, tax classification, and securities exemption chosen together because \
    each constrains the others."""

[[practice_areas.rwa-tokenization.process]]
title = "Offering documents"
detail = """\
    PPM or offering circular, operating or trust agreement, subscription documents, \
    and the legal terms the token represents."""

[[practice_areas.rwa-tokenization.process]]
title = "Smart contract legal review"
detail = """\
    Confirm the token's transfer restrictions, lockups, and distributions match the \
    legal documents, alongside an independent code audit."""

[[practice_areas.rwa-tokenization.process]]
title = "Investor onboarding"
detail = """\
    KYC/AML, accreditation verification, whitelisting, and Form D plus Tennessee and \
    other state notice filings."""

[[practice_areas.rwa-tokenization.process]]
title = "Issuance and ongoing compliance"
detail = """\
    Cap table and transfer-agent setup, distributions, annual reporting, and resales \
    through compliant venues."""

[[practice_areas.rwa-tokenization.faqs]]
q = "Does tokenizing a property change the deed?"
a = """\
    Usually the property is deeded once into the owning entity and that deed is \
    recorded with the county Register of Deeds. After that, token transfers move \
    interests in the entity, not the land, so each trade needs no new deed."""

[[practice_areas.rwa-tokenization.faqs]]
q = "Can non-accredited investors buy?"
a = """\
    Under Reg D 506(c), no. Under Reg CF or Reg A+, yes, with more disclosure and, \
    for Reg A+, SEC qualification of the offering."""

[[practice_areas.rwa-tokenization.faqs]]
q = "Can token holders resell?"
a = """\
    Reg D securities are restricted under Rule 144 for a holding period. After that, \
    resales generally go through a registered broker-dealer or alternative trading \
    system. The token's code enforces these limits."""

[[practice_areas.rwa-tokenization.faqs]]
q = "What if the property has a mortgage?"
a = """\
    Most mortgages have a due-on-sale clause that a transfer to an LLC can trigger. \
    Lender consent or a refinance comes before the transfer."""

[[practice_areas.rwa-tokenization.faqs]]
q = "How are investors taxed?"
a = """\
    An LLC taxed as a partnership issues K-1s and passes income and depreciation \
    through to investors. We coordinate the structure with your CPA."""


