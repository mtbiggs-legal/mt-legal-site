    """\
        Family matters are personal, and I treat them that way. Whether you are \
        working through a divorce or a custody arrangement, or putting a will and \
        guardianship in place for your children, you deserve a lawyer who listens \
        first and explains every option in plain English.""",
    """\
        Because I have been in the crypto space since 2017, I also know where \
        digital wealth hides in a family's finances: the wallet that never made it \
        onto a disclosure, the exchange account an executor cannot open, the \
        business interest nobody valued. And when a matter does go to court, I \
        prepare it the way a trial attorney prepares every contested case.""",
