# Marketing copy for the practice-area pages and the Emerging Tech hub.
# Loaded by blueprints/practice_areas.py. Edit the text here; no Python needed.
#
# Practice areas appear on the site in the order they appear in this file.
# case_types are the real intake dropdown values (see CASE_ATTORNEY_MAP in
# shared.py and templates/intake.html): the first one pre-selects the intake
# form's Case Type field when a visitor clicks through.
#
# Optional sections, rendered by templates/practice_area.html only when present:
#   story      Madison's personal note: heading, paras
#   overview   a paragraph under the page head
#   local      how the matter plays out in Nashville / Middle Tennessee courts
#   structures cards: name, summary, fits
#   process    ordered steps: title, detail
#   fees       rows: tier, fee, with fees_note underneath
#   faqs       q, a
# Every area also has helps: plain-language points on how representation
# helps, shown in the expandable homepage cards and on the practice page.
#
# Long text uses """\ ... """ strings: a line ending in a backslash joins onto
# the next line, so keep the space before each backslash.


[practice_areas.estate-business]
name = "Digital Asset Structuring"
tagline = """\
    Trusts, entities, and access plans built for digital assets, so what you own \
    today and what you'll own next reach the right people."""
case_types = ["Estate Planning"]
helps = [
    """\
        Inventories everything you own, from wallets and tokenized interests to \
        royalties and online accounts, so nothing is lost.""",
    """\
        Places assets in trusts that avoid probate and pass to your family privately \
        and quickly.""",
    """\
        Gives your executor legal authority and a secure path to digital assets, \
        without exposing your keys today.""",
    """\
        Keeps the plan current as you acquire new kinds of assets, marry, have \
        children, or start a business.""",
]
overview = """\
    Most estate plans were written for a house, a bank account, and a retirement \
    fund. Today's families also hold digital assets that can vanish if no one has \
    the keys or the legal authority to reach them. We plan for what you have and for \
    what is coming."""
focus = [
    "Wills, trusts, and probate-avoidance strategies",
    "Business entity formation and succession planning",
    "Fiduciary and guardian appointments",
    "Digital-asset and cryptocurrency inheritance",
    "Powers of attorney and incapacity plans",
]

[practice_areas.estate-business.story]
heading = "Where passion meets paper"
paras = [
    """\
        I have been involved in the crypto space since 2017, through bull runs, \
        crashes, exchange collapses, and the long build in between. Over that time I \
        have seen how easily digital wealth can disappear: a lost seed phrase, a \
        hardware wallet nobody knows how to open, an exchange account an executor \
        has no authority to reach.""",
    """\
        This is where my passion meets paper. I write estate plans as someone who \
        actually holds and uses these assets, so the documents match how your keys, \
        wallets, and accounts really work, and your family is not left at the mercy \
        of a platform's support desk. Your keys stay yours. The plan makes sure the \
        right people can reach them when it matters.""",
]

[[practice_areas.estate-business.process]]
title = "Asset inventory"
detail = """\
    Traditional and digital assets alike: where they are, how they're held, and who \
    can reach them."""

[[practice_areas.estate-business.process]]
title = "Goals conversation"
detail = "Who should inherit, who should decide, and what you want to protect against."

[[practice_areas.estate-business.process]]
title = "Plan documents"
detail = """\
    Will, trusts, powers of attorney, healthcare directives, and digital access \
    instructions."""

[[practice_areas.estate-business.process]]
title = "Funding the plan"
detail = "Retitling property and accounts into trusts, the step most plans skip."

[[practice_areas.estate-business.process]]
title = "Periodic review"
detail = "A check-in when the law changes or your assets do."

[[practice_areas.estate-business.faqs]]
q = "What happens to my crypto when I die?"
a = """\
    If no one can access your keys, it may be lost for good. A crypto estate plan \
    documents access without exposing keys while you're alive."""

[[practice_areas.estate-business.faqs]]
q = "Can a trust own tokenized real estate?"
a = """\
    Yes. A trust can hold LLC interests or digital securities, as long as the \
    token's transfer rules and investor whitelist allow the trust as a holder."""

[[practice_areas.estate-business.faqs]]
q = "Do I need a will if I have a trust?"
a = """\
    Yes. A short 'pour-over' will catches anything left outside the trust and names \
    guardians for minor children."""

[[practice_areas.estate-business.faqs]]
q = "Should my small business be an LLC?"
a = """\
    Usually. An LLC separates business and personal liability. We'll also look at \
    Tennessee franchise and excise tax and whether an S-election makes sense."""


[practice_areas.criminal-defense]
name = "Criminal Defense"
tagline = """\
    Standing between you and the full weight of the state: DUI, drug, assault, \
    theft, and felony defense in Davidson, Rutherford, and surrounding county \
    courts."""
case_types = ["Criminal Defense"]
helps = [
    """\
        Protects your rights from the first police contact. No statements, searches, \
        or interviews without counsel.""",
    """\
        Challenges the State's evidence: the stop, the search, lab results, and \
        witness credibility.""",
    "Negotiates with prosecutors for dismissal, diversion, or reduced charges.",
    """\
        Takes your case to trial when the State can't prove it, and pursues \
        expungement afterward.""",
]
overview = """\
    Madison Biggs spent more than five years with the Nashville Defenders, handling \
    every kind of criminal case, often as an uphill battle from the first day. \
    Before law school he worked inside the Rutherford County criminal court clerk's \
    office. He knows how these cases move from General Sessions through Criminal \
    Court, and what it takes to get a charge reduced, diverted, or dismissed."""
focus = [
    """\
        Constitutional protections under the Fourth, Fifth, and Sixth Amendment \
        challenges""",
    "Suppression arguments and Brady/Giglio material",
    "Sentencing guidelines and mitigation",
    "Procedural defenses and challenges to the state’s case",
    "DUI defense, implied-consent hearings, and restricted licenses",
    "Judicial diversion, pretrial diversion, and expungement eligibility",
]
local = """\
    Most Nashville cases begin in Davidson County General Sessions Court, where \
    bond, preliminary hearings, and many misdemeanor resolutions happen. Felonies \
    bound over go to the grand jury and Davidson County Criminal Court. We also \
    appear in Rutherford, Williamson, Wilson, and Sumner County courts."""

[practice_areas.criminal-defense.story]
heading = "Where passion meets the courtroom"
paras = [
    """\
        I learned how criminal cases really work from inside the system. Before law \
        school I spent two years as a deputy court clerk in Rutherford County's \
        criminal court, watching cases move from filing to disposition, and I saw \
        how often the person at the center of it all had the least say. In law \
        school I interned with the District Attorney's Office, so I know how the \
        other side builds a case. Then I chose the defense table, and spent more \
        than five years with the Nashville Defenders taking on every sort of case, \
        many of them uphill battles against long odds.""",
    """\
        That is still the job: you against the full weight of the state, and me \
        making sure the state has to prove every word. I read the discovery myself, \
        I stand beside you in court myself, and you can reach me directly. The same \
        belief that pulled me into crypto in 2017, that individuals deserve control \
        over their own lives and property, is the one I bring to your defense.""",
]

[[practice_areas.criminal-defense.process]]
title = "Call early"
detail = """\
    Ideally before your first court date. Bond, no-contact conditions, and evidence \
    preservation can be addressed right away."""

[[practice_areas.criminal-defense.process]]
title = "Discovery and investigation"
detail = """\
    Body-cam, dash-cam, lab results, and witness statements, reviewed for \
    suppression issues and weaknesses in the State's case."""

[[practice_areas.criminal-defense.process]]
title = "Negotiate or litigate"
detail = "Diversion, reduced charges, or dismissal where available. Trial when it isn't."

[[practice_areas.criminal-defense.process]]
title = "Clean up the record"
detail = """\
    Expungement and record relief once the case is over, where Tennessee law allows \
    it."""

[[practice_areas.criminal-defense.faqs]]
q = "Should I talk to the police about my case?"
a = """\
    Not without a lawyer. You can politely decline to answer questions and ask for \
    counsel. Anything you say can be used against you."""

[[practice_areas.criminal-defense.faqs]]
q = "Can my charge be expunged in Tennessee?"
a = """\
    Often, yes. Dismissed charges, completed diversion, and many eligible \
    convictions can be expunged under T.C.A. § 40-32-101. Eligibility depends on the \
    offense and your record."""

[[practice_areas.criminal-defense.faqs]]
q = "What is judicial diversion?"
a = """\
    A form of probation under T.C.A. § 40-35-313 that, if completed, ends in \
    dismissal and expungement. Not every charge or defendant qualifies."""


[practice_areas.civil-rights]
name = "Civil Rights Litigation"
tagline = """\
    Holding government accountable when it oversteps: police misconduct, unlawful \
    searches and arrests, and violations of your constitutional rights."""
case_types = ["Civil Rights", "Civil Litigation"]
helps = [
    """\
        Evaluates whether your rights were violated and who can be held responsible, \
        from individual officers to the agency itself.""",
    """\
        Preserves body-cam footage, records, and witness accounts before they \
        disappear.""",
    """\
        Navigates qualified immunity and the Tennessee Governmental Tort Liability \
        Act, which shape every claim against the government.""",
    """\
        Files suit in state or federal court and pursues compensation and changes in \
        policy.""",
]
overview = """\
    The same principle behind our criminal defense work drives our civil rights \
    practice: a person deserves protection from overreaching power. When police, \
    jails, or government agencies violate the Constitution, the law gives you a way \
    to hold them to account."""
focus = [
    "Excessive force and police misconduct claims under 42 U.S.C. § 1983",
    "False arrest, malicious prosecution, and unlawful search and seizure",
    "Jail and detention conditions, including denial of medical care",
    "First Amendment retaliation, including for recording or criticizing officials",
    "Due process and equal protection violations by state and local government",
    "Claims under the Tennessee Governmental Tort Liability Act",
]
local = """\
    Civil rights claims against Metro Nashville and surrounding counties can be \
    filed in federal court for the Middle District of Tennessee or in state court. \
    In Tennessee, most § 1983 claims must be filed within one year, so acting \
    quickly matters."""

[practice_areas.civil-rights.story]
heading = "Where passion meets the courtroom"
paras = [
    """\
        Civil rights cases are the clearest version of what this firm is about: one \
        person against an institution with lawyers, budgets, and immunity doctrines \
        on its side. My years in the criminal courts taught me how those \
        institutions operate from the inside, and where their account of what \
        happened tends to come apart.""",
    """\
        I take these cases because accountability should not depend on how powerful \
        the other side is. If an officer or agency crossed a line, I will tell you \
        plainly whether the claim is strong, move quickly to preserve the evidence, \
        and push for both compensation and change.""",
]

[[practice_areas.civil-rights.faqs]]
q = "What is a § 1983 claim?"
a = """\
    A federal lawsuit against people acting for the government, such as police \
    officers, who violate your constitutional rights."""

[[practice_areas.civil-rights.faqs]]
q = "What is qualified immunity?"
a = """\
    A defense that can shield officials from personal liability unless the right \
    they violated was clearly established. It is a hurdle, not always a bar."""

[[practice_areas.civil-rights.faqs]]
q = "I have a criminal case pending. Can I still bring a civil rights claim?"
a = """\
    Often, but the timing and what you say matter. The criminal case usually comes \
    first, and the two need to be handled together."""


[practice_areas.stablecoins]
name = "Stablecoins & Agentic Commerce"
tagline = """\
    Issue, accept, or build on stablecoins under the new federal framework, and set \
    the rules for AI agents that pay and get paid on your behalf."""
case_types = ["Stablecoins / Agentic Payments"]
helps = [
    """\
        Maps where your business fits under federal and state rules before you \
        launch.""",
    "Drafts the terms that settle who carries the risk.",
    "Sets the ground rules for AI agents that send or receive money for you.",
    """\
        Represents you with banks, payment partners, and regulators as rules are \
        finalized.""",
]
overview = """\
    Stablecoins are digital dollars on a blockchain, and the federal GENIUS Act \
    (2025) created the first national framework for them. For Nashville businesses \
    that means a real opportunity, and we help you capture it on a compliant \
    footing. The next wave is agentic payments: AI agents that buy, sell, and settle \
    on a person's or company's behalf, raising new questions about authority, \
    liability, and consumer protection."""
focus = [
    "GENIUS Act analysis for issuers, wallets, exchanges, and payment platforms",
    "Accepting and holding stablecoins in your business",
    "State licensing and compliance questions",
    "Agentic payments: authority and liability for AI agents",
    "Tax and accounting treatment",
]

[practice_areas.stablecoins.story]
heading = "Where passion meets paper"
paras = [
    """\
        I have watched stablecoins grow from a trading tool in 2017 into a payment \
        rail that banks, fintechs, and now AI agents are building on. I have spent \
        real time in this community, at the national Bitcoin conferences and at DC \
        Fintech Week, so I come to your project knowing how builders actually \
        think.""",
    """\
        My role is to make sure the person or business building something new is not \
        outmatched by the incumbents and regulators who write the rules. I translate \
        the GENIUS Act and state law into terms you can operate under, and put \
        agreements in place that hold up when a bank, partner, or regulator pushes \
        back.""",
]

[[practice_areas.stablecoins.process]]
title = "Use-case review"
detail = """\
    Who sends, holds, and receives the stablecoin, and who touches customer funds \
    along the way."""

[[practice_areas.stablecoins.process]]
title = "Regulatory map"
detail = """\
    GENIUS Act status, money transmission, AML, sanctions, consumer protection, and \
    tax, in a written memo."""

[[practice_areas.stablecoins.process]]
title = "Documents and partners"
detail = "Customer terms, processor and custodian agreements, and internal policies."

[[practice_areas.stablecoins.process]]
title = "Launch and monitor"
detail = "Updates as federal and state regulators finalize their rules."

[[practice_areas.stablecoins.faqs]]
q = "What is the GENIUS Act?"
a = """\
    A 2025 federal law creating the first national framework for payment \
    stablecoins. Issuers must be licensed, hold one-to-one reserves in cash and \
    short-term Treasuries, and publish reserve reports. Regulators are still writing \
    the implementing rules."""

[[practice_areas.stablecoins.faqs]]
q = "Can my business accept stablecoins today?"
a = """\
    Yes. Most merchants use a processor that converts to dollars or holds the coins \
    in custody. The legal work is in your customer terms, refund policy, accounting, \
    and choosing compliant partners."""

[[practice_areas.stablecoins.faqs]]
q = "Can stablecoins pay interest?"
a = """\
    The GENIUS Act bars issuers of payment stablecoins from paying interest or yield \
    to holders. Rewards offered by third parties raise their own securities and \
    consumer-protection questions."""

[[practice_areas.stablecoins.faqs]]
q = "What are agentic payments?"
a = """\
    Payments started by an AI agent acting for a person or business, like an \
    assistant that books and pays for travel or software that pays per-use fees in \
    stablecoins. The law on who is responsible when an agent overspends or is \
    tricked is still developing, so contracts and controls matter."""

[[practice_areas.stablecoins.faqs]]
q = "Who is liable if my AI agent makes a bad payment?"
a = """\
    It depends on how the payment was authorized and which rails it used. Card and \
    bank payments by consumers come with error-resolution rights; stablecoin \
    transfers usually cannot be reversed. Clear mandates, limits, and vendor terms \
    allocate the risk in advance."""

[[practice_areas.stablecoins.faqs]]
q = "Are stablecoin payments taxable?"
a = """\
    The IRS treats digital assets, including stablecoins, as property. Receiving \
    them as payment is income, and spending or converting them is a disposition that \
    must be reported, even when the gain is near zero."""


