# Emerging Tech hub (/emerging-tech): the practice areas it links into, and
# the expandable "what's changing" briefings underneath them.
[emerging_tech]
areas = ["estate-business", "stablecoins", "rwa-tokenization"]

[[emerging_tech.topics]]
label = "AI"
title = "Tennessee's ELVIS Act"
teaser = "AI voice and likeness cloning, and who is liable for it."
body = """\
    The Ensuring Likeness, Voice, and Image Security Act (2024) adds a person's \
    voice to Tennessee's right of publicity. It creates liability not only for \
    people who publish an unauthorized AI clone, but for tools whose primary purpose \
    is producing one. Artists, labels, studios, and AI developers in Nashville all \
    need to know where the lines are."""

[[emerging_tech.topics]]
label = "AI"
title = "Who owns AI-generated work"
teaser = "Copyright, training data, and what your contracts say."
body = """\
    The U.S. Copyright Office requires human authorship, so material generated \
    entirely by AI may not be protected. Works that combine human creativity with AI \
    assistance can be. Meanwhile, litigation over training data is unresolved, which \
    makes vendor indemnities and output-ownership clauses the practical protection \
    for most businesses."""

[[emerging_tech.topics]]
label = "Privacy"
title = "Tennessee Information Protection Act"
teaser = "Tennessee's consumer data privacy law and AI."
body = """\
    Tennessee's comprehensive privacy law gives consumers rights to access, correct, \
    delete, and opt out of certain uses of their personal data, and requires covered \
    businesses to run assessments for higher-risk processing. AI systems trained on \
    or making decisions about customers are a common trigger."""

[[emerging_tech.topics]]
label = "AI"
title = "The EU AI Act for U.S. companies"
teaser = "When a Nashville company has to follow European AI rules."
body = """\
    If your AI product or its output is used in the European Union, the EU AI Act \
    can apply regardless of where you are based. It sorts AI uses by risk, bans some \
    outright, and imposes documentation and transparency duties on others. \
    Obligations phase in over several years."""

[[emerging_tech.topics]]
label = "Blockchain"
title = "Is your token a security?"
teaser = "The Howey test, exemptions, and a shifting federal posture."
body = """\
    Federal regulators' approach to crypto has shifted repeatedly, but the Howey \
    test still decides whether a token sale is an investment contract. A written \
    analysis before launch, and an exemption such as Reg D, Reg A+, or Reg CF when \
    the answer is yes, remains the safest path."""

[[emerging_tech.topics]]
label = "Stablecoins"
title = "Stablecoins and the GENIUS Act"
teaser = "The first federal framework for digital dollars, and the growth it unlocks."
body = """\
    The GENIUS Act (2025) sets licensing, one-to-one reserve, and disclosure rules \
    for payment stablecoin issuers and bars issuers from paying holders interest. \
    With clearer rules, banks, payment companies, and merchants are moving in, \
    making stablecoins a practical way to settle payments faster and cheaper. \
    Regulators are still finalizing the details."""

[[emerging_tech.topics]]
label = "Payments"
title = "Agentic payments"
teaser = "AI agents that pay and get paid, and who is liable when they slip."
body = """\
    AI agents are starting to buy, subscribe, and settle invoices on their own, \
    often over stablecoin rails. Authority, spending limits, and liability for \
    mistaken or manipulated payments are still being worked out."""

[[emerging_tech.topics]]
label = "Tax"
title = "Crypto yield and taxes"
teaser = "Staking rewards, DeFi yield, and the new Form 1099-DA."
body = """\
    Staking rewards are ordinary income when received, and selling crypto later \
    creates capital gain or loss. Brokers now report crypto sales to the IRS on Form \
    1099-DA, so missing cost basis or unreported yield is easier for the IRS to \
    spot. Tennessee has no state income tax on wages or investment income, but \
    federal rules apply in full."""

[[emerging_tech.topics]]
label = "Blockchain"
title = "Tennessee's DAO law"
teaser = "Decentralized organizations as Tennessee LLCs."
body = """\
    Tennessee lets an LLC operate as a decentralized organization, governed by its \
    members or by smart contract, with liability protection for members. For \
    Tennessee-based communities it can be a simpler home than Wyoming or an offshore \
    foundation."""

[[emerging_tech.topics]]
label = "Tokenization"
title = "Tokenized real-world assets"
teaser = "Real estate, debt, and revenue on a blockchain."
body = """\
    Tokenization puts ownership of real estate, loans, or income streams into \
    digital securities that can be issued and transferred on-chain. The technology \
    is new, but the law is familiar: entity formation, securities exemptions, title, \
    and transfer restrictions all still apply."""

[[emerging_tech.topics]]
label = "Planning"
title = "Digital assets when you die"
teaser = "Keys, accounts, and fiduciary access in Tennessee."
body = """\
    Tennessee law gives executors and trustees a path to digital accounts, but only \
    if your documents grant it, and no law can recover crypto whose keys are lost. A \
    digital-asset plan pairs legal authority with a secure, practical way in."""
