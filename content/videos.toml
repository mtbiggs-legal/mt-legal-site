# Videos from the firm's YouTube channel, each shown at the top of its blog post.
# Loaded by services/videos.py. Edit here; no Python needed.
#
# To add one, copy a [[videos]] block:
#   id        the part after "v=" in the YouTube link
#   title     as it appears on YouTube
#   summary   one plain sentence, shown to search engines
#   uploaded  the upload date and time from YouTube
#   duration  length as PT<minutes>M<seconds>S, e.g. PT2M37S
#   post      the blog post's slug (the end of its address); the video shows
#             at the top of that post
#
# Long text uses """\ ... """ strings: a line ending in a backslash joins onto
# the next line, so keep the space before each backslash.

