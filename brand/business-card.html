<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Standard US card, 3.5 x 2 in. business-card.pdf is the trimmed size;
     business-card-print.pdf adds a 1/8 in bleed on every side (3.75 x 2.25 in)
     for printers that trim after printing. Open this page with #bleed to see
     the bleed version. Print with "Margins: none" and "Background graphics" on. */
  :root { --bleed: 0in; }
  @page { size: 3.5in 2in; margin: 0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #E9E5DC; font-family: Inter, Arial, sans-serif; }
  .sheet { display: flex; flex-wrap: wrap; gap: 32px; justify-content: center; padding: 40px 16px; }
  .card {
    width: calc(3.5in + 2 * var(--bleed)); height: calc(2in + 2 * var(--bleed));
    padding: var(--bleed); overflow: hidden; position: relative;
    box-shadow: 0 6px 20px rgba(20,24,31,.18);
  }
  .card-in { width: 3.5in; height: 2in; position: relative; }
  @media print {
    body { background: none; }
    .sheet { display: block; padding: 0; }
    .card { box-shadow: none; page-break-after: always; break-after: page; }
  }

  .front { background: #FFFDF9; color: #14181F; }
  .front .card-in { display: flex; align-items: center; padding: 0 .24in; gap: .17in; }
  .front .info { flex: 1; min-width: 0; }
  .front .rule { width: 1px; align-self: stretch; margin: .42in 0; background: #B9AE93; flex: none; }
  .name { font-family: Fraunces, Georgia, serif; font-size: 12pt; white-space: nowrap; line-height: 1.15; margin: 0; }
  .title { font-size: 5.6pt; letter-spacing: .16em; text-transform: uppercase; color: #7D6E4C; margin: 3pt 0 9pt; font-weight: 600; }
  .lines { font-size: 7pt; line-height: 1.6; color: #39414F; margin: 0; }
  .lines b { color: #7D6E4C; font-weight: 600; }
  .qr { flex: none; display: flex; flex-direction: column; align-items: center; }
  .qr img { width: .72in; height: .72in; display: block; image-rendering: pixelated; }
  .qr span { font-size: 4.6pt; letter-spacing: .16em; text-transform: uppercase; color: #7D6E4C; font-weight: 600; margin-top: 2pt; }

  .back { background: #14181F; color: #B9AE93; }
  .back .card-in { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .back img { width: .95in; height: .95in; display: block; }
  .back p { font-size: 5.6pt; letter-spacing: .22em; text-transform: uppercase; margin: 10pt 0 0; color: #8A8371; font-weight: 500; }
</style>
<script>
  // #bleed: the print-shop version, with the background running 1/8 in past the trim.
  if (location.hash === "#bleed") {
    document.documentElement.style.setProperty("--bleed", ".125in");
    var page = document.createElement("style");
    page.textContent = "@page { size: 3.75in 2.25in; margin: 0; }";
    document.head.appendChild(page);
  }
</script>
</head>
<body>
<div class="sheet">
  <div class="card front"><div class="card-in">
    <div class="info">
      <p class="name">Madison T. Biggs, Esq.</p>
      <p class="title">Founder &amp; Managing Attorney</p>
      <p class="lines">
        615-601-0633<br>
        Mtbiggs@midtennlegal.com<br>
        <b>midtennlegal.com</b>
      </p>
    </div>
    <div class="rule"></div>
    <div class="qr">
      <img src="qr-midtennlegal.png" alt="QR code linking to midtennlegal.com">
      <span>Scan to visit</span>
    </div>
  </div></div>
  <div class="card back"><div class="card-in">
    <img src="mt-legal-mark.png" alt="MT Legal mark">
    <p>Nashville &middot; Middle Tennessee</p>
  </div></div>
</div>
</body>
</html>
