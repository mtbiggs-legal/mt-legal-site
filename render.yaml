# Render Blueprint for the MT Legal website.
# Launch mode: public site + intake only (PUBLIC_SITE_ONLY=1). Secrets marked
# sync: false are entered in the Render dashboard, never committed here.
services:
  - type: web
    name: mt-legal
    runtime: python
    plan: starter                  # a persistent disk requires a paid instance
    buildCommand: pip install -r requirements.txt
    # One worker: client records are files on disk, so keep a single writer
    # process; threads handle concurrent requests. Keep this at 1 worker and
    # do not add --preload: the blog's locks are in-process, so a second process
    # would start a second blog scheduler and could draft or publish twice.
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    disk:
      name: mt-legal-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: TZ                       # Nashville time: the blog's weekly draft lands Monday local, and its stored times are local
        value: America/Chicago
      - key: APP_ENV
        value: production
      - key: PUBLIC_SITE_ONLY
        value: "1"
      - key: DATA_DIR
        value: /var/data
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_ENCRYPTION_KEY      # python scripts/generate_data_key.py — back it up
        sync: false
      - key: ANTHROPIC_API_KEY        # website chat assistant and intake summaries
        sync: false
      - key: ANTHROPIC_WORKSPACE_ID   # only if the key isn't scoped to a workspace
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: FIRM_EMAIL
        sync: false
      - key: FIRM_PHONE
        sync: false
      - key: FIRM_WEBSITE             # must be the live https URL: blog review links are built from it
        sync: false
      - key: BLOG_AUTOGEN             # weekly AI-drafted blog post, emailed for review
        value: "1"
      # - key: BLOG_MODEL             # optional; defaults to claude-sonnet-5-5
      #   value: claude-sonnet-5-5
      - key: CAL_BOOKING_URL
        sync: false
