# Render Blueprint for the MT Legal website.
# wsgi.py serves the public site on every host and, once PORTAL_URL is set,
# the client/attorney portals on that host (e.g. https://portal.midtennlegal.com),
# from this one service and disk. Until then only the public site is served.
# Secrets marked sync: false are entered in the Render dashboard, never committed.
services:
  - type: web
    name: mt-legal
    runtime: python
    plan: starter                  # a persistent disk requires a paid instance
    buildCommand: pip install -r requirements.txt
    # Client records are in SQLite (DATA_DIR/db), which handles writers from
    # several processes, and the schedulers take a lock so only one process
    # runs them. One worker is still plenty for a solo practice; the in-memory
    # rate limits and assistant chats are per process if you raise it.
    startCommand: gunicorn wsgi:application --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    disk:
      name: mt-legal-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: TZ                       # Nashville time: the blog's weekly draft lands Monday local, and its stored times are local
        value: America/Chicago
      - key: APP_ENV
        value: production
      - key: PUBLIC_SITE_ONLY
        value: "1"
      - key: SITE_URL                 # the public site's https address; links are built from it
        sync: false
      # - key: PORTAL_URL             # set (and delete PUBLIC_SITE_ONLY) to turn the portals on,
      #                             # e.g. https://portal.midtennlegal.com
      #   sync: false                 # (add that domain to this service in Render first)
      - key: BACKUP_ENCRYPTION_KEY    # scripts/backup_data.py; keep a copy off the server
        sync: false
      - key: DATA_DIR
        value: /var/data
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_ENCRYPTION_KEY      # python scripts/generate_data_key.py — back it up
        sync: false
      - key: ANTHROPIC_API_KEY        # website chat assistant and intake summaries
        sync: false
      - key: ANTHROPIC_WORKSPACE_ID   # only if the key isn't scoped to a workspace
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: FIRM_EMAIL
        sync: false
      - key: FIRM_PHONE
        sync: false
      - key: FIRM_WEBSITE             # must be the live https URL: blog review links are built from it
        sync: false
      - key: BLOG_AUTOGEN             # weekly AI-drafted blog post, emailed for review
        value: "1"
      # - key: BLOG_MODEL             # optional; defaults to claude-sonnet-5-5
      #   value: claude-sonnet-5-5
      - key: CAL_BOOKING_URL
        sync: false
